name: Native CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.compiler }} / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        compiler: [gcc, clang]
        mode: [optimized, sanitizers]
    env:
      CC: ${{ matrix.compiler }}
      BUILD_MODE: ${{ matrix.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 install \
            --yes --no-install-recommends \
            build-essential clang pkg-config libsodium-dev libsqlite3-dev python3 openssl
      - name: Build and run all regressions
        shell: bash
        run: bash .github/scripts/check-native.sh
