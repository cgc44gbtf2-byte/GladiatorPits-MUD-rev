# EXAMPLE ONLY: replace certificate path; validate with haproxy -c -f FILE.
# Keep the MUD backend on loopback, GLAD_TRUSTED_PROXY=127.0.0.1.
# Never enable accept-proxy on an Internet-facing listener.
global
    maxconn 128

defaults
    mode tcp
    timeout connect 5s
    timeout client 5m
    timeout server 5m

frontend mud_tls
    bind 0.0.0.0:4000 ssl crt /etc/haproxy/certs/mud.pem ssl-min-ver TLSv1.2
    # Optional IPv6 frontend; backend remains IPv4 and forwards TCP6 client IPs.
    # bind [::]:4000 v6only ssl crt /etc/haproxy/certs/mud.pem ssl-min-ver TLSv1.2
    default_backend mud_backend

backend mud_backend
    server mud 127.0.0.1:3000 send-proxy
